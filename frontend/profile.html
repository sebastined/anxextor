<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - anxextor</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .profile-header {
            background: linear-gradient(135deg, #1a237e 0%, #1976d2 100%);
            color: white;
            padding: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .profile-picture {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
            border: 3px solid white;
        }
        
        .profile-info h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        
        .profile-info p {
            margin: 0;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #1976d2;
        }
        
        .actions {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .actions h2 {
            margin-top: 0;
            color: #1a237e;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #1976d2;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1565c0;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-danger {
            background: #d32f2f;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c62828;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <img id="profilePicture" src="" alt="Profile" class="profile-picture">
            <div class="profile-info">
                <h1 id="userName">Loading...</h1>
                <p id="userEmail">...</p>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Scans</h3>
                <div class="value" id="scanCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Member Since</h3>
                <div class="value" id="memberSince" style="font-size: 18px;">-</div>
            </div>
            <div class="stat-card">
                <h3>Sign-In Provider</h3>
                <div class="value" id="provider" style="font-size: 18px;">-</div>
            </div>
            <div class="stat-card">
                <h3>Account Type</h3>
                <div class="value" id="accountType" style="font-size: 18px;">User</div>
            </div>
        </div>
        
        <div class="actions">
            <h2>Account Actions</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="window.location.href='/'">
                    🏠 Back to Scanner
                </button>
                <button class="btn btn-secondary" onclick="refreshProfile()">
                    🔄 Refresh Stats
                </button>
                <button class="btn btn-danger" onclick="logout()">
                    🚪 Logout
                </button>
            </div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                window.location.href = '/auth.html';
                return;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load profile');
                }

                const user = response.json();
                
                // Update UI
                document.getElementById('userName').textContent = user.full_name || user.email.split('@')[0];
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('scanCount').textContent = user.scan_count || 0;
                
                // Display provider
                const provider = user.provider || 'google';
                const providerIcon = provider === 'github' ? '🐙' : '🔐';
                const providerName = provider.charAt(0).toUpperCase() + provider.slice(1);
                document.getElementById('provider').textContent = `${providerIcon} ${providerName}`;
                
                // Display role
                const role = user.role || 'user';
                const roleMap = {
                    'user': 'User',
                    'manager': 'Manager 👔',
                    'admin': 'Admin 👑',
                    'super_admin': 'Super Admin ⚡'
                };
                document.getElementById('accountType').textContent = roleMap[role] || 'User';
                
                // Handle profile picture
                if (user.picture) {
                    document.getElementById('profilePicture').src = user.picture;
                } else {
                    // Default avatar
                    document.getElementById('profilePicture').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.full_name || user.email)}&background=1976d2&color=fff&size=80`;
                }
                
                // Format member since date
                const memberDate = new Date(user.created_at);
                document.getElementById('memberSince').textContent = memberDate.toLocaleDateString('en-US', { 
                    month: 'short', 
                    year: 'numeric' 
                });
                
                // Store user data
                localStorage.setItem('user', JSON.stringify(user));
            } catch (error) {
                console.error('Profile load error:', error);
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
                window.location.href = '/auth.html';
            }
        }

        function refreshProfile() {
            loadProfile();
        }

        async function logout() {
            const token = localStorage.getItem('access_token');
            
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        // Load profile on page load
        window.onload = loadProfile;
    </script>
</body>
</html>
